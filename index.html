<title>Dashy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: cinematic intro (clock, stats, week-at-a-glance, aurora) → dashboard.
     Dark-first editorial shell, warm amber-clay accent, light variant mirrors it.
     Roles are color-coded; the accent is held for signal only. */
  :root {
    --bg: #0B0B0D; --card: #141417; --card-alt: #1B1B1F;
    --border: rgba(255,255,255,0.08); --fg: #F4F4F2; --sub: #9a9aa2; --faint: #6a6a72;
    --accent: #E0954A; --accent-ink: #0B0B0D; --accent-bg: rgba(224,149,74,0.16);
    --urgent: #F09595; --urgent-bg: rgba(240,120,120,0.14);
    --glow: 0 0 9px;
    --area-class: #34D399; --area-180dc: #E0954A; --area-caso: #EC79A8; --area-ra: #A78BFA; --area-research: #60A5FA;
    --a1: #E0954A; --a2: #6366F1; --a3: #EC79A8;
    color-scheme: dark;
    --display: "Archivo", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F4F1EA; --card: #FFFFFF; --card-alt: #FAF7F0;
      --border: rgba(0,0,0,0.07); --fg: #1A1A19; --sub: #6b6b64; --faint: #9a9a90;
      --accent: #C2691C; --accent-ink: #FFFFFF; --accent-bg: rgba(194,105,28,0.12);
      --urgent: #B23A2E; --urgent-bg: rgba(178,58,46,0.10); --glow: 0 0 0;
      --a1: #C2691C; --a2: #6366F1; --a3: #D4537E; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #F4F1EA; --card: #FFFFFF; --card-alt: #FAF7F0;
    --border: rgba(0,0,0,0.07); --fg: #1A1A19; --sub: #6b6b64; --faint: #9a9a90;
    --accent: #C2691C; --accent-ink: #FFFFFF; --accent-bg: rgba(194,105,28,0.12);
    --urgent: #B23A2E; --urgent-bg: rgba(178,58,46,0.10); --glow: 0 0 0;
    --a1: #C2691C; --a2: #6366F1; --a3: #D4537E; color-scheme: light;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- intro ---------- */
  #intro { position: relative; overflow: hidden; min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #intro.leaving { animation: introOut .5s cubic-bezier(.4,0,.2,1) forwards; }
  #intro[hidden] { display: none; }
  @keyframes introOut { to { opacity: 0; transform: translateY(-16px) scale(1.03); } }
  #aurora { position: absolute; inset: -30%; z-index: 0; filter: blur(70px); opacity: .55;
    background:
      radial-gradient(38% 46% at 22% 28%, var(--a1), transparent 70%),
      radial-gradient(42% 50% at 78% 32%, var(--a2), transparent 70%),
      radial-gradient(50% 55% at 50% 88%, var(--a3), transparent 72%);
    animation: drift 24s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translate(0,0) rotate(0); } 33% { transform: translate(5%,-3%) rotate(8deg); } 66% { transform: translate(-4%,3%) rotate(-6deg); } }
  .intro-inner { position: relative; z-index: 1; max-width: 720px; width: 100%; margin: 0 auto; padding-block: 44px; }
  .intro-inner > * { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .brand { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: var(--accent); margin: 0 0 14px; animation-delay: 0s; }
  .i-clock { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: var(--sub); font-variant-numeric: tabular-nums; margin: 0; animation-delay: .04s; }
  .intro-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 18px 0 0; animation-delay: .1s; }
  .intro-h { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 7.5vw, 54px); letter-spacing: -0.035em; line-height: 1.02; margin: 9px 0 0; text-wrap: balance; animation-delay: .16s; }
  .intro-sub { font-size: 16px; color: var(--sub); margin: 13px 0 0; max-width: 48ch; line-height: 1.55; animation-delay: .24s; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 26px 0 0; animation-delay: .32s; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 14px 15px; }
  .stat-n { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: -0.03em; margin: 0; font-variant-numeric: tabular-nums; }
  .stat-l { font-size: 11.5px; color: var(--sub); margin: 3px 0 0; }
  .wk-cap { font-size: 10px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--faint); margin: 26px 0 10px; animation-delay: .4s; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; animation-delay: .44s; }
  .wd { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 11px 4px; text-align: center; animation: pop .5s cubic-bezier(.2,.8,.3,1.2) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.9); } to { opacity: 1; transform: none; } }
  .wd.today { border-color: var(--accent); }
  .wd-l { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); margin: 0; }
  .wd-n { font-family: var(--display); font-weight: 700; font-size: 18px; margin: 3px 0 0; font-variant-numeric: tabular-nums; }
  .wd.today .wd-n { color: var(--accent); }
  .wd-dots { min-height: 7px; margin-top: 6px; }
  .wd-dots span { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin: 0 1px; }
  .wd-exam { margin-top: 5px; height: 3px; border-radius: 2px; background: var(--urgent); }
  .enter { margin: 30px 0 0; animation-delay: .56s; }
  .enter-btn { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 12px; padding: 14px 28px; cursor: pointer; transition: filter .15s, transform .1s; }
  .enter-btn:hover { filter: brightness(1.06); } .enter-btn:active { transform: scale(.97); }

  /* ---------- dashboard ---------- */
  #app { max-width: 1760px; margin: 0 auto; padding-block: 24px 56px; }
  #app[hidden] { display: none; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6.5vw, 48px); letter-spacing: -0.03em; line-height: 1; margin: 7px 0 0; text-wrap: balance; }
  .subline { font-size: 14px; color: var(--sub); margin: 9px 0 0; } .subline b { color: var(--fg); font-weight: 600; }
  .toggle { flex-shrink: 0; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 11px; background: var(--card); color: var(--sub); display: grid; place-items: center; cursor: pointer; }
  .toggle:hover { background: var(--card-alt); } .toggle svg { width: 17px; height: 17px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--faint); margin: 0 0 14px; }

  .snap { margin-bottom: 14px; }
  .snap-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .snap-head .label { margin: 0; color: var(--accent); }
  .snap-body { font-size: 15.5px; line-height: 1.6; margin: 0; max-width: 72ch; } .snap-body b { font-weight: 600; }
  .snap-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn { font-size: 12.5px; font-weight: 600; border-radius: 9px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--fg); }
  .btn:hover { background: var(--card-alt); }
  .btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .btn-accent:hover { filter: brightness(1.06); }

  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  .sd { background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 8px 2px; text-align: center; }
  .sd.today { border-color: var(--accent); }
  .sd-l { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--faint); margin: 0; }
  .sd-n { font-size: 14px; font-weight: 700; margin: 2px 0 0; font-variant-numeric: tabular-nums; } .sd.today .sd-n { color: var(--accent); }
  .sd-dots { display: flex; justify-content: center; gap: 2px; margin-top: 4px; min-height: 5px; }
  .sd-dots i { width: 4px; height: 4px; border-radius: 50%; display: inline-block; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 13px 15px; }
  .kpi-n { font-family: var(--display); font-weight: 800; font-size: 25px; letter-spacing: -0.03em; margin: 0; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .kpi-l { font-size: 11.5px; color: var(--sub); margin: 4px 0 0; }
  .kpi-sub { font-size: 11px; color: var(--faint); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }

  .cards { column-count: 3; column-gap: 16px; }
  .cards > section { width: 100%; margin: 0 0 16px; break-inside: avoid; -webkit-column-break-inside: avoid; }
  .prog-foot { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--border); }
  @media (max-width: 1040px) { .cards { column-count: 2; } }
  @media (max-width: 680px) { .cards { column-count: 1; } }

  /* density */
  :root[data-density="compact"] .card { padding: 12px 13px; }
  :root[data-density="compact"] .cards { column-gap: 12px; }
  :root[data-density="compact"] .cards > section { margin-bottom: 12px; }
  :root[data-density="compact"] .kpis { gap: 10px; }
  :root[data-density="compact"] .label { margin-bottom: 10px; }
  :root[data-density="compact"] #app { padding-block: 18px 40px; }

  /* accent tint + up next */
  .accent-card { background: linear-gradient(180deg, var(--accent-bg), transparent 58%), var(--card); }
  .upnext-card { background: linear-gradient(135deg, var(--accent-bg), transparent 55%), var(--card); }
  .upnext .un-k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .un-t { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -0.02em; margin: 6px 0 0; line-height: 1.12; }
  .un-m { font-size: 12.5px; color: var(--sub); margin: 3px 0 0; }
  .un-bar { height: 6px; background: var(--card-alt); border-radius: 20px; overflow: hidden; margin: 15px 0 0; }
  .un-bar > div { height: 100%; background: var(--accent); border-radius: 20px; transition: width .4s ease; }
  .un-day { font-size: 11px; color: var(--faint); margin: 8px 0 0; }

  /* accent swatches */
  .swatches { display: flex; gap: 7px; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; transition: transform .12s; }
  .sw.on { border-color: var(--fg); transform: scale(1.08); }

  /* drag to reorder */
  .card { position: relative; }
  .grip { position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border: none; background: transparent; color: var(--faint); cursor: grab; opacity: 0; transition: opacity .15s; display: grid; place-items: center; font-size: 14px; line-height: 1; border-radius: 7px; z-index: 4; }
  .card:hover .grip { opacity: .6; } .grip:hover { opacity: 1; background: var(--card-alt); } .grip:active { cursor: grabbing; }
  .card.dragging { opacity: .45; outline: 2px dashed var(--accent); outline-offset: 2px; }

  /* smart "do next" card */
  .donext-card { background: linear-gradient(135deg, var(--accent-bg), transparent 55%), var(--card); }
  .dn-k { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .dn-title { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; line-height: 1.15; margin: 7px 0 0; }
  .dn-sub { font-size: 12.5px; color: var(--sub); margin: 4px 0 0; }
  .dn-action { margin-top: 13px; }

  /* vertical ink-line schedule */
  .tl { position: relative; min-height: 380px; }
  .rail-line { position: absolute; left: 54px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--border); }
  .rail-now { position: absolute; left: 50px; right: 2px; height: 0; border-top: 1.5px dashed var(--accent); transform: translateY(-50%); z-index: 2; }
  .rail-now span { position: absolute; left: 8px; top: -8px; font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--card); padding: 0 5px; }
  .rail-ev { position: absolute; left: 0; right: 0; transform: translateY(-50%); }
  .rail-time { position: absolute; left: 0; top: 0; width: 46px; text-align: right; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--sub); line-height: 1.2; }
  .rail-dot { position: absolute; left: 49px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--dot); box-shadow: var(--glow) var(--dot); border: 2px solid var(--card); }
  .rail-body { padding-left: 72px; }
  .rail-ev.past { opacity: 0.4; }
  .rail-ev.live .rail-dot { box-shadow: 0 0 0 4px var(--accent-bg); }
  .ev-title { font-size: 14px; font-weight: 600; margin: 0; } .ev-meta { font-size: 12.5px; color: var(--sub); margin: 1px 0 0; }
  .nowpill { display: inline-block; font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-bg); border-radius: 20px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .join { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 4px 11px; text-decoration: none; }
  /* equal-height spine: tall cards fill their column */
  #scheduleCard { display: flex; flex-direction: column; flex: 1; } #scheduleCard .tl { flex: 1; }
  #countCard { display: flex; flex-direction: column; flex: 1; } #countCard #countList { flex: 1; }
  .cd-row { display: flex; align-items: baseline; gap: 13px; padding: 10px 0; border-top: 1px solid var(--border); }
  .cd-row:first-child { border-top: none; padding-top: 2px; }
  .cd-n { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--accent); min-width: 50px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .cd-l { font-size: 13.5px; font-weight: 600; margin: 0; }
  .cd-s { font-size: 11.5px; color: var(--sub); margin: 1px 0 0; }
  .calpill { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); background: var(--card-alt); border-radius: 20px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  /* fortune (omikuji) */
  .fun-card { background: linear-gradient(135deg, var(--accent-bg), transparent 55%), var(--card); display: flex; flex-direction: column; }
  .omikuji { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
  .omi-level { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; font-size: 40px; line-height: 1; color: var(--accent); letter-spacing: .05em; }
  .omi-en { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 6px 0 0; }
  .omi-msg { font-size: 13.5px; line-height: 1.5; color: var(--fg); margin: 10px 0 0; }
  .omi-draw { margin-top: 13px; }

  .addrow { display: flex; gap: 7px; align-items: center; background: var(--card-alt); border-radius: 11px; padding: 6px 8px; margin-bottom: 6px; }
  .addrow input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--fg); font-size: 13.5px; font-family: var(--body); }
  .addrow input::placeholder { color: var(--faint); }
  .areasel { background: transparent; border: none; color: var(--sub); font-size: 12px; font-family: var(--body); outline: none; cursor: pointer; }
  .mic { background: none; border: none; color: var(--sub); cursor: pointer; padding: 3px; display: grid; place-items: center; } .mic svg { width: 16px; height: 16px; } .mic.live { color: var(--urgent); }
  .hint { font-size: 11px; color: var(--faint); margin: 0 0 11px 2px; }
  .hint kbd { font-family: var(--body); background: var(--card-alt); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; font-size: 10.5px; }

  .task { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; }
  .check { flex-shrink: 0; margin-top: 1px; width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .check.done { background: var(--accent); border-color: var(--accent); }
  .check svg { width: 11px; height: 11px; color: var(--accent-ink); opacity: 0; } .check.done svg { opacity: 1; }
  .task-main { flex: 1; min-width: 0; } .task-title { font-size: 13.5px; margin: 0; }
  .task.done .task-title { text-decoration: line-through; color: var(--faint); }
  .task-due { font-size: 12px; color: var(--sub); margin: 1px 0 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .task-due.over { color: var(--urgent); }
  .adot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .del { flex-shrink: 0; background: none; border: none; color: var(--faint); cursor: pointer; opacity: 0; padding: 2px; } .task:hover .del { opacity: 1; } .del svg { width: 15px; height: 15px; }
  .play { flex-shrink: 0; background: none; border: none; color: var(--faint); cursor: pointer; opacity: 0; padding: 2px; } .task:hover .play { opacity: 1; } .play svg { width: 15px; height: 15px; } .play.on { opacity: 1; color: var(--accent); }
  .task.active { } .focuspill { display: inline-block; font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-bg); border-radius: 20px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .fc-editor { display: flex; flex-direction: column; gap: 13px; margin-bottom: 14px; }
  .fc-presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset { font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--sub); border-radius: 20px; padding: 4px 13px; cursor: pointer; }
  .preset.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .fc-steppers { display: flex; gap: 22px; flex-wrap: wrap; }
  .stepper { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); }
  .stepper b { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--fg); min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-size: 16px; line-height: 1; cursor: pointer; }
  /* full-screen focus mode */
  .focusmode { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .focusmode[hidden] { display: none; }
  .fm-aurora { position: absolute; inset: -30%; z-index: 0; filter: blur(80px); opacity: .4;
    background: radial-gradient(38% 46% at 25% 30%, var(--a1), transparent 70%), radial-gradient(42% 50% at 75% 35%, var(--a2), transparent 70%), radial-gradient(50% 55% at 50% 85%, var(--a3), transparent 72%);
    animation: drift 24s ease-in-out infinite; }
  .fm-inner { position: relative; z-index: 1; text-align: center; padding: 0 20px; max-width: 440px; margin: 0 auto; }
  .fm-ring { position: relative; width: min(68vw, 300px); aspect-ratio: 1; margin: 0 auto 26px; }
  .fm-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .fm-track { fill: none; stroke: var(--border); stroke-width: 3; opacity: .55; }
  .fm-prog { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .fm-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .fm-phase { font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .fm-time { font-family: var(--display); font-weight: 700; font-size: clamp(46px, 13vw, 84px); letter-spacing: -0.03em; line-height: 1; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  .fm-task { font-size: 16px; color: var(--sub); margin: 0 0 24px; }
